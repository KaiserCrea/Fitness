<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909"><link rel="manifest" href="manifest.webmanifest"><style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#f4f1eb;font-family:Arial,sans-serif;padding-bottom:86px}#app{max-width:760px;margin:auto;padding:28px}.eyebrow,.gold{color:#d9ad49}h1{font-size:46px;margin:8px 0 28px}h2{margin:5px 0}.card{background:linear-gradient(145deg,#1d1d1d,#151515);border:1px solid #3a352a;border-radius:28px;padding:24px;margin:16px 0}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.btn{border:1px solid #5b5138;background:#191919;color:#eee;border-radius:18px;padding:15px;font-size:17px}.primary{background:#d9ad49;color:#17120a;font-weight:bold}.exercise{padding:20px 0;border-bottom:1px solid #302d28}.exercise:last-child{border:0}.exercise input,.time{width:100%;background:#111;border:1px solid #514830;color:#fff;padding:15px;border-radius:16px;font-size:17px;margin:10px 0}.statuses{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.statuses button{padding:13px 5px;background:#171717;color:#eee;border:1px solid #555;border-radius:15px}.statuses .sel{border-color:#d9ad49;color:#d9ad49}.muted{color:#999}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.session{cursor:pointer}.bar{height:9px;background:#242424;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#d9ad49}nav{position:fixed;bottom:0;left:0;right:0;height:72px;background:rgba(10,10,10,.97);border-top:1px solid #302c24;display:flex;justify-content:center;z-index:9}nav button{width:25%;max-width:190px;background:none;border:0;color:#8f8f8f}nav button.active{color:#d9ad49;font-weight:bold}@media(max-width:500px){#app{padding:24px 20px}h1{font-size:42px}.grid{grid-template-columns:1fr 1fr}.statuses button{font-size:14px}}
</style>
<title>Fitness</title></head><body><div id="app"></div>
<nav><button data-tab="today">Aujourd'hui</button><button data-tab="program">Programme</button><button data-tab="progress">Progression</button><button data-tab="history">Historique</button></nav>
<script>const SESSIONS={"G1A": ["Développé couché machine convergente à disques", "Écarté unilatéral poulie basse", "Pec Deck / Butterfly", "Dips lestés", "Curl biceps barre EZ", "Curl biceps haltères", "Curl unilatéral pupitre vertical", "Crunch abdominal", "Abdominaux machine à crunch assis"], "G2A": ["Tirage horizontal poulie double poignée", "Tirage bras tendus poulie haute barre", "Rowing unilatéral haltère", "Tirage vertical prise serrée en V", "Extension triceps poulie", "Barre au front", "Dips sur banc", "Relevé de jambes", "Flexions latérales du buste"], "G3A": ["Développé épaules assis haltères", "Tirage menton", "Élévation latérale unilatérale poulie basse", "Élévations latérales haltères", "Hack Squat", "Leg Extension", "Leg Curl allongé", "Mollets debout machine", "Circuit abdos 8 min"], "G1B": ["Écarté poulie basse assis sur banc", "Développé couché haltères", "Écarté couché haltères", "Pec Deck / Butterfly", "Spider Curl", "Curl marteau haltères", "Curl biceps poulie basse en V", "Circuit abdos 8 min"], "G2B": ["Tirage vertical prise neutre", "Tirage horizontal prise large", "Rowing assis machine / Seated Row", "Tirage vertical prise serrée en V", "Extension triceps corde", "Extension triceps au-dessus de la tête haltère", "Extension triceps couché haltères", "Crunch lesté décliné — 10 kg", "Flexion latérale banc décliné kettlebell"], "G3B": ["Développé militaire barre", "Oiseau machine / Reverse Pec Deck", "Élévations latérales assis haltères", "Squat libre", "Leg Press", "Mollets assis machine", "Relevé de jambes", "Crunch abdominal"], "G1C": ["Développé incliné haltères", "Écarté incliné haltères paumes face à face", "Écarté poulie basse", "Chest Press", "Curl incliné haltères", "Curl barre EZ prise pronation", "Curl biceps machine", "Gainage"], "G2C": ["Soulevé de terre barre", "Rowing barre", "Lat Pulldown", "Rowing poulie basse prise large haut du torse", "Extension triceps poulie arrière", "Extension triceps poulie haute prise inversée", "Dips assis machine", "Circuit abdos 8 min"], "G3C": ["Développé militaire debout barre", "Oiseau poulie", "Élévation latérale bilatérale poulie basse", "Élévation latérale couchée banc incliné haltère", "Goblet Squat", "Fentes marchées", "Mollets assis machine", "Relevé de jambes chaise romaine", "Flexion latérale lestée banc décliné kettlebell"], "ATH A": ["Tapis incliné — 10 min", "Rameur — 20 min", "Vélo — 15 min", "Sled Push — 6 à 8 passages", "Tapis — temps restant jusqu’à 60 min", "Étirements / mobilité — 15 min"], "ATH B": ["Échauffement / tapis — 10 min", "Sled Push — 15 min", "Vélo intervalles — 15 min", "Rameur intervalles — 10 min", "Tapis intervalles rapides — 7 min", "Retour au calme — 3 min", "Étirements / mobilité — 15 min"], "Full Mix 1": ["Développé incliné Smith Machine", "Écarté poulie basse vers le haut debout", "Développé épaules assis haltères", "Élévations latérales haltères", "Rowing barre EZ", "Biceps Black Jack", "Magic Triceps barre EZ", "Crunch poulie haute à genoux", "Relevé de genoux suspendu", "Wood Chop poulie"], "Full Mix 2": ["Rowing poitrine appuyée banc incliné haltères", "Tirage vertical prise neutre", "Tractions", "Curl pupitre barre EZ", "Spider Curl haltère banc incliné", "Extension Magic Triceps haltères", "Extension triceps au-dessus de la tête corde", "Élévation latérale unilatérale poulie arrière", "Pec Deck / Butterfly", "Crunch lesté banc décliné — 10 kg", "Flexion latérale lestée banc décliné kettlebell"], "Full Mix 3": ["Leg Press horizontale", "Hack Squat", "Leg Extension", "Leg Curl allongé", "Mollets debout machine", "Adduction hanche machine", "Abduction hanche machine", "Circuit abdos 8 min"], "Full Mix 4": ["Développé incliné haltères", "Écarté incliné poulie basse", "Élévation latérale unilatérale poulie arrière", "Oiseau haltères poitrine appuyée banc incliné", "Curl biceps poulie basse en V", "Extension triceps corde", "Tirage vertical prise neutre", "Adduction hanche machine", "Abduction hanche machine", "Face Pull corde poulie haute"]};</script><script>

const $=s=>document.querySelector(s), app=$('#app');
let state=JSON.parse(localStorage.getItem('fitness-v1')||'null')||{setup:false,week:'A',nextG:1,history:[],refs:{},selected:null};
let tab='today'; const save=()=>localStorage.setItem('fitness-v1',JSON.stringify(state));
const fmt=d=>new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d);
function nav(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
function render(){nav(); if(!state.setup)return setup(); ({today,program,progress,history}[tab])();}
function setup(){app.innerHTML=`<div class=eyebrow>FITNESS</div><h1>Première installation</h1><div class=card><label>Semaine du cycle</label><select id=w class=time><option>A</option><option>B</option><option>C</option></select><label>Prochaine séance G</label><select id=g class=time><option value=1>G1</option><option value=2>G2</option><option value=3>G3</option></select><button id=start class="btn primary" style="width:100%">Commencer</button></div>`; $('#start').onclick=()=>{state.week=$('#w').value;state.nextG=+$('#g').value;state.setup=true;save();render()}}
function currentG(){return `G${state.nextG}${state.week}`}
function today(){
 let key=state.selected||currentG(), comp=key.startsWith('ATH')||key.startsWith('Full');
 app.innerHTML=`<div class=eyebrow>FITNESS</div><div class=row><h1>Aujourd'hui</h1><span class="btn gold">Semaine ${state.week}</span></div><div class=muted>${fmt(new Date())}</div>
 <div class=card><div class=gold>${comp?'SÉANCE COMPLÉMENTAIRE':'SÉANCE PRIORITAIRE'}</div><h2>${key}</h2><label>Heure de début</label><input id=startTime type=time class=time value="${new Date().toTimeString().slice(0,5)}"></div>
 <div class=card id=exs>${(SESSIONS[key]||[]).map((x,i)=>exercise(key,x,i)).join('')}</div>
 <div class=card><label>Heure de fin</label><input id=endTime type=time class=time><label>Durée totale réelle (min)</label><input id=duration type=number class=time placeholder="ex. 75"><button id=record class="btn primary" style="width:100%">Enregistrer la séance</button></div>`;
 document.querySelectorAll('.statuses button').forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});
 $('#record').onclick=()=>record(key);
}
function exercise(key,x,i){let ref=state.refs[x]||'';return `<div class=exercise data-i="${i}"><div class=row><div><small class=gold>EXERCICE ${i+1}</small><h2>${x}</h2></div><button class=btn onclick="sheet('${encodeURIComponent(x)}')">Voir la fiche</button></div><input class=ref placeholder="Charge / référence réellement utilisée" value="${ref}"><div class=statuses><button data-v="Réussi">Réussi</button><button data-v="Échoué">Échoué</button><button data-v="Non réalisé">Non réalisé</button></div></div>`}
function record(key){let ex=[...document.querySelectorAll('.exercise')].map((e,i)=>({name:SESSIONS[key][i],ref:e.querySelector('.ref').value,status:e.querySelector('.sel')?.dataset.v||'Non renseigné'}));ex.forEach(x=>{if(x.ref)state.refs[x.name]=x.ref});state.history.unshift({date:new Date().toISOString(),session:key,start:$('#startTime').value,end:$('#endTime').value,duration:$('#duration').value,ex});if(/^G3/.test(key)){state.nextG=3;state.selected=null}else if(/^G[12]/.test(key)){state.nextG++;state.selected=null}else state.selected=null;save();render()}
function complementary(){return ['ATH A','ATH B','Full Mix 1','Full Mix 2','Full Mix 3','Full Mix 4']}
function program(){app.innerHTML=`<div class=eyebrow>FITNESS</div><h1>Programme</h1><div class=card><div class=row><b>Cycle G</b><span class=gold>Semaine ${state.week}</span></div></div><div class=grid>${Object.keys(SESSIONS).map(k=>`<div class="card session" onclick="openSession('${k}')"><small class=gold>${k.startsWith('G')?'GROUPE':k.startsWith('ATH')?'ATHLÉTIQUE':'FULL MIX'}</small><h2>${k}</h2><div class=muted>${SESSIONS[k].length} exercices</div></div>`).join('')}</div><div class=card><button class=btn onclick=advanceWeek()>Passer à la semaine suivante</button> <button class=btn onclick=backup()>Exporter les données</button></div>`}
function openSession(k){app.innerHTML=`<div class=eyebrow>PROGRAMME</div><button class=btn onclick="tab='program';render()">← Retour</button><h1>${k}</h1><div class=card>${SESSIONS[k].map((x,i)=>`<div class=exercise><b>${i+1}. ${x}</b><div class=muted>Référence actuelle : ${state.refs[x]||'à définir'}</div><button class=btn onclick="sheet('${encodeURIComponent(x)}')">Voir la fiche</button></div>`).join('')}</div><button class="btn primary" onclick="state.selected='${k}';save();tab='today';render()">Saisir cette séance</button>`}
function progress(){let all={};state.history.forEach(h=>h.ex.forEach(e=>{if(e.ref&&!all[e.name])all[e.name]=e.ref}));app.innerHTML=`<div class=eyebrow>FITNESS</div><h1>Progression</h1><div class=card><h2>${state.history.length} séances enregistrées</h2><div class=muted>Les références les plus récentes sont affichées ci-dessous.</div></div>${Object.entries(all).map(([n,v])=>`<div class=card><b>${n}</b><h2 class=gold>${v}</h2></div>`).join('')||'<div class=card>Aucune donnée de progression pour le moment.</div>'}`}
function history(){app.innerHTML=`<div class=eyebrow>FITNESS</div><h1>Historique</h1>${state.history.map(h=>`<div class=card><div class=row><div><small class=gold>${new Date(h.date).toLocaleDateString('fr-FR')}</small><h2>${h.session}</h2></div><b>${h.duration? h.duration+' min':''}</b></div><div class=muted>${h.start||''}${h.end?' → '+h.end:''}</div><details><summary>Voir ${h.ex.length} exercices</summary>${h.ex.map(e=>`<p>${e.name} — ${e.ref||'—'} — ${e.status}</p>`).join('')}</details></div>`).join('')||'<div class=card>Aucune séance enregistrée.</div>'}`}
function sheet(enc){let n=decodeURIComponent(enc);app.innerHTML=`<div class=eyebrow>FICHE TECHNIQUE</div><button class=btn onclick=render()>← Retour</button><h1>${n}</h1><div class=card><h2>Paramètres de l’exercice</h2><label>Référence actuelle</label><input id=sref class=time value="${state.refs[n]||''}" placeholder="kg, durée, niveau…"><button class="btn primary" onclick="state.refs[${JSON.stringify(n)}]=$('#sref').value;save();render()">Enregistrer</button></div><div class=card><h2>Illustration technique</h2><p class=muted>Emplacement préparé pour intégrer la fiche technique illustrée validée de cet exercice.</p></div>`}
function advanceWeek(){state.week={A:'B',B:'C',C:'A'}[state.week];state.nextG=1;state.selected=null;save();render()}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='fitness-sauvegarde.json';a.click()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
render();

if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

</script></body></html>
