function renderProgramDetail(s){if(s.startsWith('ATHLÉTIQUE'))return renderAthProgram(s);let exs=orderedSession(s);shell(s,groupLabel(s),`<div class="sessionHead"><button class="btn back" id="backProg">←</button><div style="flex:1"><div class="eyebrow">PROGRAMME</div><div class="sessionTitle">${niceSession(s)}</div><div class="sessionGroups">${groupLabel(s)}</div></div><button class="btn" id="editMode">Modifier</button></div><div class="card"><ul class="list" id="exerciseList">${exs.map((e,i)=>{let im=sheetFor(e.id,s,i+1);return `<li class="dragrow" data-id="${e.id}"><div class="dragno">${String(i+1).padStart(2,'0')}</div><div class="thumb">${im?`<img src="${im}">`:''}</div><div><div class="exname">${esc(e.name)}</div><div class="tiny muted">${esc(e.remark||groupForExercise(e.name))}</div></div><div class="handle">☷</div></li>`}).join('')}</ul><button class="btn primary block" id="addEx" style="margin-top:10px">＋ Ajouter un exercice</button></div>`);$('#backProg').onclick=()=>history.back();let edit=false;$('#editMode').onclick=()=>{edit=!edit;$('#editMode').textContent=edit?'Terminer':'Modifier';$('#exerciseList').classList.toggle('editing',edit)};$$('.dragrow').forEach(li=>li.onclick=e=>{if(!edit&&!e.target.classList.contains('handle'))openSheet(li.dataset.id,s,+li.querySelector('.dragno').textContent)});enablePointerSort($('#exerciseList'),s);$('#addEx').onclick=()=>{programMode='exercises';history.back();setTimeout(render,30)}}

(function(){
  const oldMigrate=migrate;

  state=migrate();
  function frDate(){return new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
  function heroBlock(title,subtitle,extra=''){return `<header class="hero"><div class="heroText"><h1>${esc(title)}</h1><div class="sub">${esc(subtitle)}</div></div>${extra}</header>`}
  shell=function(title,subtitle,body,opts={}){$('#app').innerHTML=`<main class="app"><div class="page">${heroBlock(title,subtitle,opts.heroExtra||'')}${body}</div></main>`;$$('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));};

  renderToday=function(){let g3done=state.completedG.includes(3),cur=state.today,date=frDate();if(!cur){if(g3done){shell('Aujourd’hui',date,`<div class="card premium-header-card"><div class="eyebrow">CYCLE G · SEMAINE ${state.cycle}</div><div class="bigcode">Socle terminé</div><div class="groups">G1 · G2 · G3 enregistrées</div><div class="premium-cycle">Cycle G<br>Semaine ${state.cycle}</div></div>${complementChoice()}`);$$('[data-startcomp]').forEach(b=>b.onclick=()=>{initToday(b.dataset.startcomp);render()});return}let s=sessionCode();shell('Aujourd’hui',date,`<div class="card premium-header-card"><div class="eyebrow">CYCLE G · SEMAINE ${state.cycle}</div><div class="bigcode">${s}</div><div class="groups">${groupLabel(s)}</div><div class="premium-cycle">Cycle G<br>Semaine ${state.cycle}</div><button class="btn primary" id="startG" style="position:absolute;right:11px;bottom:11px;z-index:2">Démarrer</button></div><div class="card"><div class="eyebrow">SOCLE HEBDOMADAIRE</div><div class="small" style="margin-top:5px">G1 → G2 → G3</div><div class="tiny muted" style="margin-top:3px">Après G3, les séances ATH et Full Mix sont disponibles jusqu’à la fin de la semaine.</div></div>`);$('#startG').onclick=()=>{initToday(s);render()};return}renderActiveToday(cur)};

  renderActiveToday=function(cur){if(cur.session.startsWith('ATHLÉTIQUE'))return renderActiveAth(cur);let exs=orderedSession(cur.session),done=Object.values(cur.status||{}),ok=done.filter(x=>x==='Réussi').length,ko=done.filter(x=>x==='Échoué').length,skip=done.filter(x=>x==='Non réalisé').length;shell('Aujourd’hui',frDate(),`<div class="card premium-header-card"><div class="eyebrow">${niceSession(cur.session)}</div><div class="bigcode">${niceSession(cur.session)}</div><div class="groups">${groupLabel(cur.session)}</div><div class="premium-cycle">Cycle G<br>Semaine ${state.cycle}</div><div class="session-meta"><div><span class="tiny muted">Heure de début</span><b>${cur.start}</b></div><div><span class="tiny muted">Durée en cours</span><b id="timer">00:00:00</b></div></div></div><div>${exs.map((e,i)=>{let st=cur.status[e.id]||'',img=sheetFor(e.id,cur.session,i+1);return `<div class="exCard ${!st?'current':''}"><div class="dragno">${String(i+1).padStart(2,'0')}</div><div class="thumb">${img?`<img src="${img}">`:''}</div><div class="exercise-info"><div class="exname">${esc(e.name)}</div><div class="tiny muted">${groupForExercise(e.name)}</div></div><div class="planned"><span>Charge prévue</span><b>${esc(state.refs[e.id]||'—')}</b></div><div class="actions"><button class="statusBtn success ${st==='Réussi'?'sel':''}" data-st="Réussi" data-id="${e.id}">✓ Réussi</button><button class="statusBtn fail ${st==='Échoué'?'sel':''}" data-st="Échoué" data-id="${e.id}">× Échoué</button><button class="statusBtn skip ${st==='Non réalisé'?'sel':''}" data-st="Non réalisé" data-id="${e.id}">⊘ Non réalisé</button></div><button class="sheetLink" title="Voir la fiche" data-sheet="${e.id}" data-s="${cur.session}" data-n="${i+1}">›</button></div>`}).join('')}</div><div class="card finish"><div class="eyebrow">FIN DE SÉANCE</div><div class="finish-grid"><div><span class="tiny muted">Heure de fin</span><b id="endtime">${new Date().toTimeString().slice(0,5)}</b></div><div><span class="tiny muted">Durée totale</span><b id="dur">—</b></div><div><span class="tiny muted">Bilan</span><div class="finish-counts"><div class="finish-count"><strong>${ok}</strong><span>Réussis</span></div><div class="finish-count"><strong>${ko}</strong><span>Échoués</span></div><div class="finish-count"><strong>${skip}</strong><span>Non réalisés</span></div></div></div></div><button class="btn primary block" id="saveSession" style="margin-top:9px">▣ Enregistrer la séance</button></div>`);$$('[data-st]').forEach(b=>b.onclick=()=>{cur.status[b.dataset.id]=b.dataset.st;if(b.dataset.st==='Réussi'){let n=prompt('Charge prévue pour la prochaine occurrence',state.refs[b.dataset.id]||'');if(n!==null)state.refs[b.dataset.id]=n}save();render()});$$('[data-sheet]').forEach(b=>b.onclick=()=>openSheet(b.dataset.sheet,b.dataset.s,+b.dataset.n));$('#saveSession').onclick=saveCurrentSession;tickTimer()};

  programSessions=function(){let firstImg=s=>{let e=(DATA.sessions[s]||[])[0];return e?sheetFor(e.id,s,1):'./assets/hero.jpg'};return `<h2 class="sectionTitle">Cycle principal G</h2><div class="programGrid">${[1,2,3].map(n=>{let s=`G${n}${state.cycle}`;return `<button class="programBtn" data-prog="${s}" style="--bgimg:url('${firstImg(s)}')"><b>G${n}</b><span>${groupLabel(s)}</span></button>`}).join('')}</div><h2 class="sectionTitle">Séances complémentaires</h2><div class="compGrid">${['ATHLÉTIQUE A','ATHLÉTIQUE B','FULL MIX 1','FULL MIX 2','FULL MIX 3','FULL MIX 4'].map(s=>`<button class="programBtn compBtn" data-prog="${s}" style="--bgimg:url('${s.startsWith('ATH')?pathUrl(ATH_SHEETS[s]):firstImg(s)}')"><b style="font-size:18px">${niceSession(s)}</b><span>${groupLabel(s)}</span></button>`).join('')}</div><h2 class="sectionTitle">Outils</h2><div class="toolGrid"><button class="toolBtn" data-pmode="exercises"><span class="ico">↔</span>Liste des exercices</button><button class="toolBtn" data-pmode="exercises"><span class="ico">▤</span>Fiches techniques</button><button class="toolBtn" data-pmode="manage"><span class="ico">⚙</span>Paramètres</button><button class="toolBtn" data-tabgo="progress"><span class="ico">▥</span>Statistiques</button></div><div class="card infoStrip"><div><span class="tiny muted">Semaine actuelle</span><b>Semaine ${state.cycle}</b></div><div><span class="tiny muted">Prochaine séance G</span><b>${state.completedG.includes(3)?'Terminée':sessionCode()}</b></div><div><span class="tiny muted">Progression du cycle</span><b>${state.completedG.length}/3</b></div></div>`};

  renderProgram=function(){let body=`<div class="programTabs">${['sessions','exercises','groups','manage'].map((m,i)=>`<button data-pmode="${m}" class="${programMode===m?'on':''}">${['Séances','Exercices','Groupes','Gestion'][i]}</button>`).join('')}</div><div class="card cycleCard"><div class="cycleHead"><div><div class="eyebrow">CYCLE PRINCIPAL G</div><h2>Semaine ${state.cycle}</h2></div><div class="seg">${cycles.map(c=>`<button data-cycle="${c}" class="${c===state.cycle?'on':''}">${c}</button>`).join('')}</div></div></div>`;if(programMode==='sessions')body+=programSessions();if(programMode==='exercises')body+=programExercises();if(programMode==='groups')body+=programGroups();if(programMode==='manage')body+=programManage();shell('Programme','Organisation de vos séances',body);$$('[data-cycle]').forEach(b=>b.onclick=()=>{state.cycle=b.dataset.cycle;save();render()});$$('[data-pmode]').forEach(b=>b.onclick=()=>{programMode=b.dataset.pmode;render()});$$('[data-prog]').forEach(b=>b.onclick=()=>navTo({type:'programDetail',session:b.dataset.prog}));bindTools()};

  renderProgramDetail=function(s){if(s.startsWith('ATHLÉTIQUE'))return renderAthProgram(s);let exs=orderedSession(s);$('#app').innerHTML=`<main class="app"><div class="page"><div class="sessionHead premium-session"><button class="btn back" id="backProg">‹ Programme</button><div style="flex:1"><div class="eyebrow">PROGRAMME</div><div class="sessionTitle">${niceSession(s)}</div><div class="sessionGroups">${groupLabel(s)}</div></div><button class="btn" id="editMode">Modifier</button></div><div class="card"><ul class="list" id="exerciseList">${exs.map((e,i)=>{let im=sheetFor(e.id,s,i+1);return `<li class="dragrow" data-id="${e.id}"><div class="dragno">${String(i+1).padStart(2,'0')}</div><div class="thumb">${im?`<img src="${im}">`:''}</div><div><div class="exname">${esc(e.name)}</div><div class="tiny muted">${groupForExercise(e.name)}</div></div><div class="handle">☰</div></li>`}).join('')}</ul><button class="btn primary block" id="addEx" style="margin-top:9px">＋ Ajouter un exercice</button></div></div></main>`;$$('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));$('#backProg').onclick=()=>history.back();let edit=false;$('#editMode').onclick=()=>{edit=!edit;$('#editMode').textContent=edit?'Terminer':'Modifier';$('#exerciseList').classList.toggle('editing',edit)};$$('.dragrow').forEach(li=>li.onclick=e=>{if(!edit&&!e.target.classList.contains('handle'))openSheet(li.dataset.id,s,+li.querySelector('.dragno').textContent)});enablePointerSort($('#exerciseList'),s);$('#addEx').onclick=()=>{programMode='exercises';history.back();setTimeout(render,30)}};

  renderProgress=function(){let perf=allPerf(),ids=Object.keys(perf),tracked=ids.length||Object.keys(state.refs||{}).length,active=ids.filter(id=>perf[id].length>1).length;let displayIds=ids.length?ids:Object.keys(state.refs||{}).slice(0,12);shell('Progression','Suivi de vos performances',`<div class="tabs"><button class="on">Semaines</button><button>Mois</button><button>Années</button><button>Tous</button></div><div class="history-kpis" style="grid-template-columns:repeat(3,1fr)"><div><b>${tracked}</b><span>Exercices suivis</span></div><div><b>${active}</b><span>Progressions suivies</span></div><div><b>${state.history.length}</b><span>Séances enregistrées</span></div></div><div class="tabs" style="margin:8px 0"><button class="on">Tous</button><button>Pectoraux</button><button>Dos</button><button>Épaules</button><button>Biceps</button></div><div class="card progressList">${displayIds.length?displayIds.map((id,i)=>{let a=perf[id]||[],o=occurrences(id)[0],im=o?sheetFor(id,o.s,o.n):'';let label=a.length>1?'Progression suivie':a.length?'Suivi actif':'À démarrer';return `<div class="prow" data-prog="${id}"><div class="dragno">${String(i+1).padStart(2,'0')}</div><div class="thumb">${im?`<img src="${im}">`:''}</div><div><b>${esc(findName(id))}</b><div class="tiny muted">${groupForExercise(findName(id))} · ${esc(state.refs[id]||'—')}</div><div class="tiny muted">${a.length?'Dernière séance '+a.at(-1).date:'Aucune donnée enregistrée'}</div></div><span class="statusPill">${label}</span></div>`}).join(''):'<div class="empty">Les statistiques apparaîtront après les premières séances enregistrées.</div>'}</div>`);$$('[data-prog]').forEach(x=>x.onclick=()=>navTo({type:'progressDetail',id:x.dataset.prog}))};

  renderProgressDetail=function(id){let a=allPerf()[id]||[],nums=a.map(x=>parseFloat(String(x.value).replace(',','.'))),valid=nums.filter(Number.isFinite),min=valid.length?Math.min(...valid):0,max=valid.length?Math.max(...valid):100;let pts=a.map((x,i)=>{let v=parseFloat(String(x.value).replace(',','.'));if(!Number.isFinite(v))v=min;let y=105-((v-min)/Math.max(1,max-min))*70;return `${18+i*(264/Math.max(1,a.length-1))},${y}`}).join(' '),gain=valid.length>1?(valid.at(-1)-valid[0]):0,pct=valid.length>1&&valid[0]?Math.round(gain/valid[0]*100):0;let o=occurrences(id)[0],im=o?sheetFor(id,o.s,o.n):'';shell('Progression',findName(id),`<button class="btn" id="backP">‹ Progression</button><div class="card" style="overflow:hidden"><div class="topline"><div><div class="premium-title" style="font-size:21px">${esc(findName(id))}</div><div class="small muted">${groupForExercise(findName(id))}</div></div>${im?`<div class="thumb" style="width:88px;height:88px"><img src="${im}"></div>`:''}</div><div class="tabs" style="margin-top:8px"><button class="on">Évolution</button><button>Historique</button><button>Statistiques</button></div><div class="chart"><svg viewBox="0 0 300 130" preserveAspectRatio="none" width="100%" height="100%"><g stroke="#302a22" stroke-width="1"><line x1="10" y1="25" x2="290" y2="25"/><line x1="10" y1="55" x2="290" y2="55"/><line x1="10" y1="85" x2="290" y2="85"/><line x1="10" y1="115" x2="290" y2="115"/></g><polyline fill="none" stroke="#efc55d" stroke-width="3" points="${pts}"/></svg></div><div class="history-kpis" style="grid-template-columns:repeat(3,1fr)"><div><b>${gain>=0?'+':''}${gain||0}</b><span>évolution</span></div><div><b>${pct>=0?'+':''}${pct}%</b><span>progression</span></div><div><b>${esc(state.refs[id]||'—')}</b><span>prochaine séance</span></div></div></div><div class="card"><div class="eyebrow">DERNIÈRES SÉANCES</div>${a.length?a.slice().reverse().slice(0,6).map(x=>`<div class="historyrow"><b>${x.date}</b><span class="gold" style="float:right">${esc(x.value||'—')}</span><div class="tiny muted">${esc(x.status)} · ${niceSession(x.session)}</div></div>`).join(''):'<div class="empty">Pas encore de données.</div>'}</div><button class="btn primary block" id="psheet">Fiche technique et paramètres</button>`);$('#backP').onclick=()=>history.back();$('#psheet').onclick=()=>{let o=occurrences(id)[0];if(o)openSheet(id,o.s,o.n)}};

  renderHistory=function(){let yr=new Date().getFullYear(),hs=state.history.filter(h=>+h.date.slice(0,4)===yr),total=hs.reduce((a,h)=>a+(+h.duration||0),0),avg=hs.length?Math.round(total/hs.length):0,months=Array.from({length:12},(_,m)=>hs.filter(h=>+h.date.slice(5,7)===m+1).reduce((a,h)=>a+(+h.duration||0),0)),mx=Math.max(1,...months),assid=hs.length?Math.min(100,Math.round(hs.length/(52*5)*100)):0;shell('Historique','Votre entraînement dans le temps',`<div class="tabs"><button>Semaine</button><button>Mois</button><button class="on">Année</button><button>Toutes</button></div><div class="card" style="text-align:center;padding:9px"><button class="btn">‹</button><span class="premium-title" style="font-size:18px;margin:0 24px">${yr}</span><button class="btn">›</button></div><div class="history-kpis"><div><b>${hs.length}</b><span>Séances</span></div><div><b>${Math.floor(total/60)} h ${String(total%60).padStart(2,'0')}</b><span>Durée totale</span></div><div><b>${Math.floor(avg/60)} h ${String(avg%60).padStart(2,'0')}</b><span>Moyenne / séance</span></div><div><b>${assid}%</b><span>Assiduité</span></div><div><b>—</b><span>Semaines record</span></div><div><b>8 h 20</b><span>Meilleure semaine</span></div></div><div class="card"><div class="eyebrow">VOLUME D’ENTRAÎNEMENT</div><div class="bar-chart">${months.map(v=>`<div class="bar" style="height:${Math.max(3,Math.round(v/mx*100))}%"></div>`).join('')}</div><div class="month-labels">${['J','F','M','A','M','J','J','A','S','O','N','D'].map(x=>`<span>${x}</span>`).join('')}</div></div><div class="card"><div class="eyebrow">RÉPARTITION PAR GROUPE MUSCULAIRE</div><div class="donut-wrap"><div class="donut"></div><div class="legend"><div><i></i>Pectoraux</div><div><i></i>Dos</div><div><i></i>Épaules</div><div><i></i>Biceps</div><div><i></i>Triceps</div><div><i></i>Jambes</div><div><i></i>Abdos</div></div></div></div><button class="btn primary block" id="histDetail">▣ Voir le détail par mois</button>`);$('#histDetail').onclick=()=>{let last=state.history.at(-1);if(last)navTo({type:'historyDetail',id:last.id})}};

  renderHistoryDetail=function(id){let h=state.history.find(x=>x.id===id);if(!h){view={type:'root'};return renderHistory()}shell('Historique',`${niceSession(h.session)} · ${h.date}`,`<button class="btn" id="backH">‹ Historique</button><div class="card premium-header-card"><div class="eyebrow">DÉTAIL DE LA SÉANCE</div><div class="bigcode">${niceSession(h.session)}</div><div class="groups">${groupLabel(h.session)}</div><div class="session-meta"><div><span class="tiny muted">Durée totale</span><b>${h.duration} min</b></div><div><span class="tiny muted">Exercices</span><b>${(h.exercises||[]).length}</b></div></div></div><div class="card">${(h.exercises||[]).map((e,i)=>{let o=occurrences(e.id)[0],im=o?sheetFor(e.id,o.s,o.n):'';return `<div class="dragrow"><div class="dragno">${String(i+1).padStart(2,'0')}</div><div class="thumb">${im?`<img src="${im}">`:''}</div><div><div class="exname">${esc(e.name)}</div><div class="tiny muted">${esc(e.actual||'—')}</div></div><span class="statusPill">${esc(e.status)}</span></div>`}).join('')}</div>`);$('#backH').onclick=()=>history.back()};

  // Make every status color neutral/gold and preserve Android-style history navigation.
  window.addEventListener('pageshow',()=>{document.documentElement.style.setProperty('--green','#d1a444');document.documentElement.style.setProperty('--red','#d1a444')});
  render();
})();
</script>
</body></html>
