<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090a">
<title>Fitness V0.3</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{
  --bg:#09090a;--panel:#171718;--panel2:#202022;--gold:#d5ad54;--gold2:#aa8438;
  --text:#f5f2ea;--muted:#a8a39a;--line:#38332b;--green:#4f7f5d;--red:#865050;--grey:#595959
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#09090a 0%,#111113 100%);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
button,input,select{font:inherit}
.app{max-width:520px;margin:auto;padding:20px 16px 105px}
.brand{font-size:12px;font-weight:900;letter-spacing:3px;color:var(--gold)}
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
h1{font-size:30px;line-height:1.05;margin:5px 0 0}
h2{font-size:20px;margin:0}
h3{font-size:16px;margin:0}
.muted{color:var(--muted)} .small{font-size:12px}.gold{color:var(--gold)}
.badge{border:1px solid #5a4c2c;color:var(--gold);border-radius:999px;padding:7px 11px;font-size:12px}
.card{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 14px 30px #0005}
.session-hero{padding:18px}
.session-title{font-size:26px;font-weight:800;margin-top:4px}
.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}.grow{flex:1}
.btn{border:1px solid #514a3b;background:#1b1b1c;color:var(--text);padding:11px 12px;border-radius:12px}
.btn.goldbtn{background:var(--gold);border-color:var(--gold);color:#17130b;font-weight:800}
.btn.ok{border-color:#426a4e}.btn.fail{border-color:#744646}.btn.nr{border-color:#555}
.btn.selected.ok{background:#294934}.btn.selected.fail{background:#552f2f}.btn.selected.nr{background:#3a3a3a}
.timebox{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-top:10px}
.timebox input{width:112px}
input,select{background:#101011;border:1px solid #4b4437;color:#fff;border-radius:11px;padding:10px}
.exercise-card{padding:0;overflow:hidden}
.exercise-head{display:grid;grid-template-columns:54px 1fr auto;gap:11px;align-items:center;padding:14px 14px 10px}
.thumb{width:54px;height:54px;border-radius:13px;border:1px solid #4a4235;background:radial-gradient(circle at 50% 35%,#453a28 0 10%,#1a1a1b 11% 100%);display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:900}
.exnum{font-size:11px;color:var(--gold);font-weight:800}.exname{font-size:16px;font-weight:800;line-height:1.25}
.sheetbtn{border:0;background:none;color:var(--gold);font-size:12px;padding:6px}
.exercise-body{padding:0 14px 14px}
.label{font-size:12px;color:var(--muted);margin-bottom:5px}.reference-input{width:100%;margin-bottom:10px}
.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.nextref{margin-top:10px;width:100%}
.footer-card{margin-top:16px}
.footer-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.footer-grid input{width:100%;margin-top:5px}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.summary span{font-size:12px;padding:6px 8px;border-radius:999px;background:#111;border:1px solid #3f3a32}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0c0c0df4;border-top:1px solid #302c25;display:flex;justify-content:center;padding-bottom:max(7px,env(safe-area-inset-bottom));z-index:10}
.navin{width:min(520px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:7px}.tab{border:0;background:none;color:#8e8981;padding:10px 1px;font-size:11px}.tab.active{color:var(--gold);font-weight:800}
.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.comp{padding:14px;border:1px solid #403a31;border-radius:15px;background:#131314}.comp h3{margin-bottom:7px}.last{font-size:12px;color:var(--muted)}
.notice{padding:12px 14px;border:1px solid #4f452f;background:#16140f;border-radius:14px;color:#d8c89e;font-size:13px;line-height:1.35}
.history-line{padding:11px 0;border-bottom:1px solid #302d28}.history-line:last-child{border:0}
.stat{font-size:27px;color:var(--gold);font-weight:900}
</style>
</head>
<body>
<div id="app"></div>
<script>
const PROGRAM={
 A:{
  G1:["Développé couché machine convergente à disques","Écarté unilatéral poulie basse","Pec Deck / Butterfly","Dips lestés","Curl biceps barre EZ","Curl biceps haltères","Curl unilatéral pupitre vertical","Crunch abdominal","Abdominaux sur machine à crunch assis avec appui thoracique"],
  G2:["Tirage horizontal poulie double poignée","Tirage bras tendus poulie haute barre","Rowing unilatéral haltère","Tirage vertical prise serrée en V","Extension triceps poulie","Barre au front","Dips sur banc","Relevé de jambes","Flexions latérales du buste"],
  G3:["Développé épaules assis avec haltères","Tirage menton","Élévation latérale unilatérale poulie basse","Élévations latérales haltères","Hack Squat","Leg Extension","Leg Curl allongé","Mollets debout machine","Circuit abdos 8 min"]
 },
 B:{
  G1:["Écarté poulie basse assis sur banc","Développé couché haltères","Écarté couché haltères","Pec Deck / Butterfly","Spider Curl","Curl marteau haltères","Curl biceps poulie basse en V","Circuit abdos 8 min"],
  G2:["Tirage vertical prise neutre","Tirage horizontal prise large","Rowing assis machine / Seated Row","Tirage vertical prise serrée en V","Extension triceps corde","Extension triceps au-dessus de la tête haltère","Extension triceps couché haltères","Crunch lesté décliné — 10 kg","Flexion latérale sur banc décliné avec kettlebell"],
  G3:["Développé militaire barre","Oiseau machine / Reverse Pec Deck","Élévations latérales assis avec haltères","Squat libre","Leg Press","Mollets assis machine","Relevé de jambes","Crunch abdominal"]
 },
 C:{
  G1:["Développé incliné haltères","Écarté incliné haltères, paumes face à face","Écarté poulie basse","Chest Press","Curl incliné haltères","Curl barre EZ prise pronation","Curl biceps machine","Gainage"],
  G2:["Soulevé de terre à la barre","Rowing barre","Lat Pulldown","Rowing poulie basse prise large vers le haut du torse","Extension triceps poulie arrière","Extension triceps poulie haute prise inversée","Dips assis machine","Circuit abdos 8 min"],
  G3:["Développé militaire debout barre","Oiseau poulie","Élévation latérale bilatérale poulie basse","Élévation latérale couchée banc incliné avec haltère","Goblet Squat","Fentes marchées","Mollets assis machine","Relevé de jambes à la chaise romaine","Flexion latérale lestée sur banc décliné avec kettlebell"]
 }
};
const COMPLEMENTS=["ATH A","ATH B","Full Mix 1","Full Mix 2","Full Mix 3","Full Mix 4"];
const KEY="fitness-v03";
const $=s=>document.querySelector(s);
function mondayISO(d=new Date()){let x=new Date(d);let day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x.toISOString().slice(0,10)}
function weekDiff(a,b){return Math.floor((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/604800000)}
function advanceLetter(l,n){let arr=["A","B","C"];return arr[(arr.indexOf(l)+n%3+3)%3]}
let prev=JSON.parse(localStorage.getItem("fitness-v02")||"null")||JSON.parse(localStorage.getItem("fitness-v01")||"null");
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{
 setup:prev?.setup||false,week:prev?.week||"A",nextG:prev?.nextG||"G1",
 history:prev?.history||[],refs:prev?.refs||{},draft:null,weekMonday:mondayISO()
};
if(state.nextG==="DONE") state.nextG="COMPLEMENTS";
let view="today";
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function normalizeWeek(){
 let cur=mondayISO(),diff=weekDiff(state.weekMonday||cur,cur);
 if(diff>0){state.week=advanceLetter(state.week,diff);state.nextG="G1";state.draft=null;state.weekMonday=cur;save()}
}
normalizeWeek();
function nav(){return `<nav class="nav"><div class="navin">${[["today","Aujourd'hui"],["program","Programme"],["progress","Progression"],["history","Historique"]].map(x=>`<button class="tab ${view===x[0]?"active":""}" data-v="${x[0]}">${x[1]}</button>`).join("")}</div></nav>`}
function shell(title,body){$("#app").innerHTML=`<main class="app"><div class="header"><div><div class="brand">FITNESS</div><h1>${title}</h1></div><span class="badge">Semaine ${state.week}</span></div>${body}</main>${nav()}`;document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;render()})}
function setup(){
 shell("Première installation",`<p class="muted">Positionne ton cycle actuel.</p><div class="card"><div class="label">Semaine du cycle</div><select id="w" style="width:100%;margin-bottom:12px"><option>A</option><option>B</option><option>C</option></select><div class="label">Prochaine séance G</div><select id="g" style="width:100%;margin-bottom:14px"><option>G1</option><option>G2</option><option>G3</option></select><button id="go" class="btn goldbtn" style="width:100%">Commencer</button></div>`);
 $("#w").value=state.week;$("#g").value=state.nextG==="COMPLEMENTS"?"G3":state.nextG;
 $("#go").onclick=()=>{state.week=$("#w").value;state.nextG=$("#g").value;state.weekMonday=mondayISO();state.setup=true;save();render()}
}
function sessionName(){return state.nextG+state.week}
function currentList(){return PROGRAM[state.week]?.[state.nextG]||[]}
function startDraft(){
 let now=new Date(); let hh=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
 let name=sessionName(),ex={};currentList().forEach(x=>ex[x]={actual:state.refs[x]||"",status:"",next:""});
 state.draft={name,date:now.toISOString().slice(0,10),start:hh,end:"",duration:"",exercises:ex};save();render()
}
function computeDuration(d){
 if(!d.start||!d.end)return "";
 let [sh,sm]=d.start.split(":").map(Number),[eh,em]=d.end.split(":").map(Number);
 let m=(eh*60+em)-(sh*60+sm);if(m<0)m+=1440;return String(m)
}
function statusCounts(d){let vals=Object.values(d.exercises||{}).map(x=>x.status);return{ok:vals.filter(x=>x==="Réussi").length,fail:vals.filter(x=>x==="Échoué").length,nr:vals.filter(x=>x==="Non réalisé").length}}
function lastDone(name){
 let h=state.history.find(x=>x.name===name);
 if(!h)return "Jamais réalisée";
 let dt=new Date((h.date||"")+"T12:00:00");return "Dernière : "+dt.toLocaleDateString("fr-FR")
}
function today(){
 if(!state.setup)return setup();
 if(state.nextG==="COMPLEMENTS"){
   let body=`<p class="muted">${new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</p>
   <div class="card session-hero"><div class="gold small">SOCLE HEBDOMADAIRE TERMINÉ</div><div class="session-title">G3${state.week} enregistré</div><p class="muted" style="margin-bottom:0">Tu peux maintenant choisir librement une séance complémentaire pour le reste de la semaine.</p></div>
   <div class="comp-grid">${COMPLEMENTS.map(c=>`<div class="comp"><h3>${c}</h3><div class="last">${lastDone(c)}</div><button class="btn" style="width:100%;margin-top:10px" data-comp="${c}">Choisir</button></div>`).join("")}</div>`;
   shell("Aujourd'hui",body);
   document.querySelectorAll("[data-comp]").forEach(b=>b.onclick=()=>alert(b.dataset.comp+" : l'ouverture de la séance complémentaire sera intégrée dans la prochaine étape."));
   return;
 }
 let d=state.draft,L=currentList(),name=sessionName();
 let body=`<p class="muted">${new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</p>
 <div class="card session-hero"><div class="row between"><div><div class="gold small">SÉANCE PRIORITAIRE</div><div class="session-title">${name}</div></div>${!d?`<button class="btn goldbtn" id="begin">Démarrer</button>`:`<span class="badge">En cours</span>`}</div>
 ${d?`<div class="timebox">Heure de début <input id="startTime" type="time" value="${d.start}"></div>`:""}</div>`;
 if(d){
   body+=L.map((x,i)=>{let e=d.exercises[x]||{actual:"",status:"",next:""};return `<div class="card exercise-card">
   <div class="exercise-head"><div class="thumb">${i+1}</div><div><div class="exnum">EXERCICE ${i+1}</div><div class="exname">${x}</div></div><button class="sheetbtn" data-sheet="${i}">Voir la fiche</button></div>
   <div class="exercise-body"><div class="label">Charge / référence utilisée</div><input class="reference-input actual" data-i="${i}" value="${e.actual||""}" placeholder="À renseigner">
   <div class="status-grid">${["Réussi","Échoué","Non réalisé"].map((s,j)=>`<button class="btn ${j===0?"ok":j===1?"fail":"nr"} ${e.status===s?"selected":""} status" data-i="${i}" data-s="${s}">${s}</button>`).join("")}</div>
   ${e.status==="Réussi"?`<input class="nextref" data-i="${i}" value="${e.next||""}" placeholder="Prochaine référence">`:""}</div></div>`}).join("");
   let c=statusCounts(d);
   body+=`<div class="card footer-card"><h2>Fin de séance</h2><div class="footer-grid"><div><div class="label">Heure de fin</div><input id="endTime" type="time" value="${d.end}"></div><div><div class="label">Durée totale</div><input id="duration" type="number" min="0" value="${d.duration}" placeholder="min"></div></div>
   <div class="summary"><span>${c.ok} réussi${c.ok>1?"s":""}</span><span>${c.fail} échoué${c.fail>1?"s":""}</span><span>${c.nr} non réalisé${c.nr>1?"s":""}</span></div>
   <button class="btn goldbtn" id="saveSession" style="width:100%">Enregistrer la séance</button></div>`;
 }
 shell("Aujourd'hui",body);
 if(!d){$("#begin").onclick=startDraft;return}
 $("#startTime").onchange=e=>{d.start=e.target.value;if(d.end)d.duration=computeDuration(d);save();render()};
 $("#endTime").onchange=e=>{d.end=e.target.value;d.duration=computeDuration(d);save();render()};
 $("#duration").oninput=e=>{d.duration=e.target.value;save()};
 document.querySelectorAll(".actual").forEach(inp=>inp.oninput=e=>{let x=L[+e.target.dataset.i];d.exercises[x].actual=e.target.value;save()});
 document.querySelectorAll(".status").forEach(b=>b.onclick=()=>{let x=L[+b.dataset.i];d.exercises[x].status=b.dataset.s;if(b.dataset.s!=="Réussi")d.exercises[x].next="";save();render()});
 document.querySelectorAll(".nextref").forEach(inp=>inp.oninput=e=>{let x=L[+e.target.dataset.i];d.exercises[x].next=e.target.value;save()});
 document.querySelectorAll("[data-sheet]").forEach(b=>b.onclick=()=>alert("La fiche technique illustrée sera intégrée ici."));
 $("#saveSession").onclick=()=>{
   if(!d.duration){alert("Renseigne l'heure de fin ou la durée totale.");return}
   let items=L.map(x=>({name:x,...d.exercises[x]}));
   items.forEach(e=>{if(e.status==="Réussi"&&e.next.trim())state.refs[e.name]=e.next.trim();else if(e.actual.trim()&&!state.refs[e.name])state.refs[e.name]=e.actual.trim()});
   state.history.unshift({date:d.date,name:d.name,start:d.start,end:d.end,duration:+d.duration,exercises:items});
   state.draft=null;
   if(state.nextG==="G1")state.nextG="G2";else if(state.nextG==="G2")state.nextG="G3";else state.nextG="COMPLEMENTS";
   save();render()
 }
}
function program(){shell("Programme",`<div class="card"><h2>Cycle G</h2><div class="history-line"><b>Semaine A</b><div class="muted">G1A → G2A → G3A</div></div><div class="history-line"><b>Semaine B</b><div class="muted">G1B → G2B → G3B</div></div><div class="history-line"><b>Semaine C</b><div class="muted">G1C → G2C → G3C</div></div></div><div class="card"><h2>Complémentaires</h2><p class="muted">${COMPLEMENTS.join(" · ")}</p></div>`)}
function progress(){let refs=Object.entries(state.refs);shell("Progression",`<div class="card"><div class="stat">${state.history.length}</div><div class="muted">séance${state.history.length>1?"s":""} enregistrée${state.history.length>1?"s":""}</div></div><div class="card"><h2>Références actuelles</h2>${refs.length?refs.map(([k,v])=>`<div class="history-line"><b>${k}</b><div class="gold">${v}</div></div>`).join(""):`<p class="muted">Aucune référence enregistrée.</p>`}</div>`)}
function history(){shell("Historique",`<div class="card"><h2>Séances enregistrées</h2>${state.history.length?state.history.map(h=>`<div class="history-line"><b>${h.name}</b><div class="muted">${new Date((h.date||"")+"T12:00:00").toLocaleDateString("fr-FR")} · ${h.duration||0} min${h.start?" · "+h.start+(h.end?" → "+h.end:""):""}</div></div>`).join(""):`<p class="muted">Aucune séance enregistrée.</p>`}</div>`)}
function render(){normalizeWeek();if(view==="today")today();else if(view==="program")program();else if(view==="progress")progress();else history()}
render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
