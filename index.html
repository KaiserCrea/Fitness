function renderProgressDetail(name){let a=performanceSeries(name);shell(name,`<button id="backProgress" class="btn ghost smallbtn">← Progression</button><div class="card"><div class="row between"><span class="trend">${trendFor(name)}</span><span class="gold">${esc(currentRef(name)||"—")}</span></div><div class="chart">${graphSVG(a)}</div></div><div class="card"><h2>Historique</h2>${a.slice().reverse().map(x=>`<div class="listrow"><div class="row between"><b>${fmtDate(x.date)}</b><span class="gold">${esc(x.raw)}</span></div><div class="muted tiny">${x.status}${x.next?` · prochaine : ${esc(x.next)}`:""}</div></div>`).join("")||`<div class="muted">Aucune performance.</div>`}</div><button id="progSheet" class="btn" style="width:100%">Fiche technique et paramètres</button>`);$("#backProgress").onclick=()=>{progressDetail=null;render()};$("#progSheet").onclick=()=>openSheet(name,"")}

function yearStats(){
 let y=new Date().getFullYear(),hs=state.history.filter(h=>+(h.date||"").slice(0,4)===y),total=hs.reduce((s,h)=>s+(+h.duration||0),0),weeks={};hs.forEach(h=>{let w=mondayISO(new Date(h.date+"T12:00:00"));weeks[w]=(weeks[w]||0)+1});let best=Object.entries(weeks).sort((a,b)=>b[1]-a[1])[0];return{y,count:hs.length,total,avg:hs.length?Math.round(total/hs.length):0,best}}
function attendanceStats(){let old=[...state.oldWeeks],newWeeks={};state.history.forEach(h=>{let w=mondayISO(new Date(h.date+"T12:00:00"));newWeeks[w]=(newWeeks[w]||0)+1});let all=old.map(x=>({week:x.week,count:+x.count,target:3})).concat(Object.entries(newWeeks).map(([week,count])=>({week,count,target:5}))).sort((a,b)=>a.week.localeCompare(b.week));let streak=0,best=0;all.forEach(x=>{if(x.count>=x.target){streak++;best=Math.max(best,streak)}else streak=0});return{all,streak,best}}
function renderHistory(){
 if(historyDetail)return renderHistoryDetail(historyDetail);
 let s=yearStats(),att=attendanceStats(),hours=Math.floor(s.total/60),mins=s.total%60;
 shell("Historique",`<div class="segment">${["Semaine","Mois","Année","Tous"].map((x,i)=>`<button class="${i===2?"on":""}">${x}</button>`).join("")}</div><div class="metricGrid"><div class="metric"><b>${s.count}</b><span class="muted small">séances ${s.y}</span></div><div class="metric"><b>${hours}h${String(mins).padStart(2,"0")}</b><span class="muted small">durée totale</span></div><div class="metric"><b>${s.avg} min</b><span class="muted small">moyenne / séance</span></div><div class="metric"><b>${att.best}</b><span class="muted small">record d'assiduité</span></div></div><div class="card"><div class="row between"><h2>Assiduité</h2><span class="gold">Référence : 8 h 20</span></div><div class="muted small">Ancien historique : objectif 3 séances. Depuis l'application : objectif 5 séances. Aucune séance bonus ne crée de crédit.</div></div><div class="card"><h2>Séances</h2>${state.history.map(h=>`<div class="listrow" data-hid="${h.id||""}"><div class="row between"><div><div class="gold tiny">${fmtDate(h.date)}</div><b>${h.session}</b><div class="muted tiny">${GROUPS[h.session]||""}</div></div><div style="text-align:right"><b>${h.duration||0} min</b><div class="muted tiny">${h.start||""}${h.end?` → ${h.end}`:""}</div></div></div></div>`).join("")||`<div class="muted">Aucune séance détaillée enregistrée.</div>`}</div>`,"Durées, assiduité et records");
 document.querySelectorAll("[data-hid]").forEach(x=>x.onclick=e=>{historyDetail=e.currentTarget.dataset.hid;render()})
}
function renderHistoryDetail(id){let h=state.history.find(x=>(x.id||"")===id);if(!h){historyDetail=null;return render()};let ok=(h.exercises||[]).filter(x=>x.status==="Réussi").length,nr=(h.exercises||[]).filter(x=>x.status==="Non réalisé").length;shell(h.session,`<button id="backHistory" class="btn ghost smallbtn">← Historique</button><div class="card hero"><div class="gold tiny">${fmtDateLong(h.date)}</div><div class="sessionName">${h.session}</div><div class="muted">${GROUPS[h.session]||""}</div><div class="statsPills"><span>${h.duration||0} min</span><span>${(h.exercises||[]).length} exercices</span><span>${ok} réussis</span><span>${nr} non réalisés</span></div></div><div class="card">${(h.exercises||[]).map((e,i)=>`<div class="listrow"><div class="row between"><div><span class="gold tiny">${i+1}</span> <b>${esc(e.name)}</b><div class="muted tiny">${esc(e.actual||"—")}</div></div><span class="${e.status==="Réussi"?"gold":"muted"}">${e.status}</span></div></div>`).join("")}</div><button id="editHist" class="btn" style="width:100%">Modifier la séance</button>`);$("#backHistory").onclick=()=>{historyDetail=null;render()};$("#editHist").onclick=()=>alert("L'édition d'une séance historique est réservée aux corrections manuelles ; les performances d'origine restent traçables.")}

function paramFields(p){
 let type=p.type||"strength",defs={
 strength:[["sets","Séries"],["reps","Répétitions"],["load","Charge / référence"],["restSets","Repos entre séries"],["restExercises","Repos entre exercices"]],
 gainage:[["rounds","Tours"],["phase1","Phase 1"],["phase2","Phase 2"],["phase3","Phase 3"],["rest","Récupération"]],
 circuit:[["duration","Durée"],["rounds","Tours"]],
 cardio:[["duration","Durée"],["speed","Vitesse"],["incline","Inclinaison"],["resistance","Résistance / niveau"],["distance","Distance"]],
 sled:[["load","Charge"],["passes","Passages"],["distance","Distance / passage"],["recovery","Récupération"]],
 interval:[["duration","Durée"],["intense","Temps intense"],["recovery","Récupération"],["level","Résistance / niveau"],["distance","Distance"]]
 }[type]||[];
 return defs.map(([k,l])=>`<div class="field"><label>${l}</label><input data-param="${k}" value="${esc(p[k]||"")}"></div>`).join("")
}
function openSheet(name,session){
 let p=clone(paramsFor(name,session));
 let overlay=document.createElement("div");overlay.className="overlay";overlay.innerHTML=`<div class="sheet"><div class="row between"><div><div class="brand">FICHE TECHNIQUE</div><h2 style="margin-top:5px">${esc(name)}</h2></div><button id="closeSheet" class="btn smallbtn">Fermer</button></div><div class="sheetHero" style="height:auto"><div><div class="gold" style="font-weight:800">FICHE TECHNIQUE ILLUSTRÉE</div><button id="visualLibrary" class="btn smallbtn" style="margin-top:10px">Ouvrir les fiches intégrées</button></div></div><div class="notice">Les paramètres ci-dessous sont dynamiques : les modifier met à jour Aujourd'hui et la prochaine occurrence, sans modifier l'historique déjà enregistré.</div><div class="card" style="box-shadow:none;margin-bottom:0"><div class="row between"><h3>Paramètres de l'exercice</h3><span class="gold tiny">${esc(p.type||"strength")}</span></div><div class="paramGrid" id="paramGrid" style="margin-top:12px">${paramFields(p)}</div><button id="saveParams" class="btn primary" style="width:100%;margin-top:12px">Enregistrer les paramètres</button></div></div>`;
 document.body.appendChild(overlay);overlay.querySelector("#closeSheet").onclick=()=>overlay.remove();overlay.querySelector("#visualLibrary").onclick=()=>{let w=window.open("","_blank");w.document.write(`<meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#080808;color:white;font-family:Arial;padding:12px}h2{color:#d8ae50}img{width:100%;max-width:650px;display:block;margin:14px auto}</style><h2>${name}</h2>${SHEET_ASSETS.map(x=>`<img src="${x}">`).join("")}`);w.document.close()};overlay.onclick=e=>{if(e.target===overlay)overlay.remove()};overlay.querySelector("#saveParams").onclick=()=>{overlay.querySelectorAll("[data-param]").forEach(x=>p[x.dataset.param]=x.value);state.params[name]=p;if(p.load)state.refs[name]=p.load;save();overlay.remove();render()}
}

function backupJSON(){download("fitness-sauvegarde.json",JSON.stringify(state,null,2),"application/json")}
function exportCSV(){let rows=[["date","séance","début","fin","durée_min","exercice","valeur","statut","prochaine"]];state.history.forEach(h=>(h.exercises||[]).forEach(e=>rows.push([h.date,h.session,h.start,h.end,h.duration,e.name,e.actual,e.status,e.next])));download("fitness-export.csv",rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")).join("\n"),"text/csv")}
function download(name,content,type){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restoreJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.sessions||!x.history)throw 0;state=x;save();alert("Sauvegarde restaurée.");render()}catch(err){alert("Fichier de sauvegarde invalide.")}};r.readAsText(f)}

document.addEventListener("click",e=>{let t=e.target.closest("[data-tab]");if(t){tab=t.dataset.tab;programDetail=null;progressDetail=null;historyDetail=null;render()}});
render();
</script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});</script></body></html>
