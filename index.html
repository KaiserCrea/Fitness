const KEY='fitness-reconstruit-v2';
const cycles=['A','B','C'];

function defaultState(){return{installed:false,cycle:'A',nextG:1,weekKey:'',completedG:[],history:[],oldWeeks:[],refs:{},params:{},sessionOrder:{},today:null,lastComplement:{}}}
function migrate(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch{};if(s)return s;for(const k of ['fitness-v04','fitness-v03','fitness-v02','fitness-v01']){try{let x=JSON.parse(localStorage.getItem(k));if(x){s=Object.assign(defaultState(),x);s.installed=true;break}}catch{}}return s||defaultState()}
let state=migrate();
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function iso(d=new Date()){return d.toISOString().slice(0,10)}
function weekMonday(d=new Date()){let x=new Date(d);x.setHours(12,0,0,0);let day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return iso(x)}
function ensureWeek(){let wk=weekMonday();if(!state.weekKey){state.weekKey=wk}else if(state.weekKey!==wk){let i=(cycles.indexOf(state.cycle)+1)%3;state.cycle=cycles[i];state.nextG=1;state.completedG=[];state.today=null;state.weekKey=wk;save()}}
function groupLabel(s){return DATA.groupLabels[s]||''}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function sheetFor(id,session,no){return DATA.occurrenceSheetMap?.[`${session}|${no}`]||DATA.sheetMap[id]||''}
function orderedSession(s){let base=clone(DATA.sessions[s]||[]);let ord=state.sessionOrder[s];if(!ord)return base;let m=new Map(base.map(e=>[e.id,e]));return ord.map(id=>m.get(id)).filter(Boolean).concat(base.filter(e=>!ord.includes(e.id))).map((e,i)=>({...e,n:i+1}))}
function sessionCode(){ensureWeek();return `G${state.nextG}${state.cycle}`}
function nowTime(){return new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
function minutesBetween(a,b){if(!a||!b)return 0;let [ah,am]=a.split(':').map(Number),[bh,bm]=b.split(':').map(Number);let n=(bh*60+bm)-(ah*60+am);return n<0?n+1440:n}
function shell(title,subtitle,body){$('#app').innerHTML=`<main class="app"><div class="page"><header class="hero"><div class="heroText"><div class="eyebrow">FITNESS</div><h1>${esc(title)}</h1><div class="sub">${esc(subtitle)}</div></div></header>${body}</div></main>`;$$('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab))}
function initToday(s,kind='G'){state.today={session:s,kind,start:nowTime(),date:iso(),answers:{},actual:{},next:{}};save()}
function render(){ensureWeek();if(!state.installed)return renderInstall();if(tab==='today')renderToday();if(tab==='program')renderProgram();if(tab==='progress')renderProgress();if(tab==='history')renderHistory()}
function renderInstall(){$('#app').innerHTML=`<div class="install"><div class="installbox"><div class="eyebrow">PREMIÈRE INSTALLATION</div><h1 style="font-size:42px;margin:8px 0">Fitness</h1><p class="muted">Choisis la semaine du cycle et la prochaine séance G à réaliser. Ensuite l’application poursuit automatiquement.</p><div class="card"><div class="field"><label>Semaine du cycle</label><select id="cy"><option>A</option><option>B</option><option>C</option></select></div><div class="field" style="margin-top:10px"><label>Prochaine séance</label><select id="ng"><option value="1">G1</option><option value="2">G2</option><option value="3">G3</option></select></div><button id="installBtn" class="btn primary block" style="margin-top:14px">Commencer</button></div></div></div>`;$('#installBtn').onclick=()=>{state.installed=true;state.cycle=$('#cy').value;state.nextG=+$('#ng').value;state.weekKey=weekMonday();save();render()}}
function renderToday(){let g3done=state.completedG.includes(3);let cur=state.today;if(!cur){if(!g3done){let s=sessionCode();shell('Aujourd’hui',new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}),`<div class="card cycle"><div><span class="tiny gold">CYCLE G · SEMAINE ${state.cycle}</span><strong style="display:block;margin-top:4px">${s}</strong><span class="small muted">${groupLabel(s)}</span></div><button class="btn primary" id="startG">Démarrer</button></div><div class="card"><b>Socle hebdomadaire</b><div class="small muted" style="margin-top:6px">G1 → G2 → G3. À la fin de G3, les séances complémentaires sont disponibles librement jusqu’à la fin de la semaine.</div></div>`);$('#startG').onclick=()=>{initToday(s);render()};return}
shell('Aujourd’hui','Socle hebdomadaire terminé',`<div class="card finish"><div class="eyebrow">CHOIX COMPLÉMENTAIRE</div><h2 style="margin:6px 0">ATH ou Full Mix</h2><div class="small muted">Le choix d’une séance complémentaire ne modifie pas le cycle G.</div></div><div class="compGrid">${['ATHLÉTIQUE A','ATHLÉTIQUE B','FULL MIX 1','FULL MIX 2','FULL MIX 3','FULL MIX 4'].map(s=>`<div class="comp"><b>${s}</b><div class="tiny muted" style="margin-top:5px">Dernière réalisation : ${state.lastComplement[s]||'—'}</div><button class="btn block" data-startcomp="${s}" style="margin-top:10px">Choisir</button></div>`).join('')}</div>`);$$('[data-startcomp]').forEach(b=>b.onclick=()=>{initToday(b.dataset.startcomp,'C');render()});return}
let s=cur.session; if(s.startsWith('ATHLÉTIQUE'))return renderAthToday(s);
let exs=orderedSession(s);let ans=cur.answers||{};let body=`<div class="card cycle"><div><span class="tiny gold">${s}</span><strong style="display:block;margin-top:4px">${groupLabel(s)}</strong></div><div style="text-align:right"><span class="tiny muted">Début</span><b class="clock" style="display:block">${cur.start}</b></div></div>${exs.map((e,i)=>exerciseTodayCard(s,e,i,ans[e.id])).join('')}<div class="card finish"><h2>Fin de séance</h2><div class="grid2" style="margin-top:10px"><div class="field"><label>Heure de fin</label><input id="endTime" value="${nowTime()}"></div><div class="field"><label>Durée totale</label><input id="dur" type="number" value="${minutesBetween(cur.start,nowTime())}"></div></div><button id="saveSession" class="btn primary block" style="margin-top:12px">Enregistrer la séance</button></div>`;
shell('Aujourd’hui',`${s} · ${groupLabel(s)}`,body);$$('[data-status]').forEach(b=>b.onclick=()=>{let id=b.dataset.id;cur.answers[id]=b.dataset.status;if(b.dataset.status==='Réussi'){let n=prompt('Charge / référence prévue pour la prochaine occurrence :',state.refs[id]||'');if(n!==null){cur.next[id]=n;state.refs[id]=n}}save();render()});$$('[data-sheet]').forEach(b=>b.onclick=()=>openSheet(b.dataset.sheet,s,+b.dataset.no));$('#saveSession').onclick=()=>saveCurrentSession(+$('#dur').value,$('#endTime').value)}
function exerciseTodayCard(s,e,i,sel){let ref=state.refs[e.id]||'À définir';let img=sheetFor(e.id);return `<div class="card ex"><div class="exHead"><div class="thumb">${img?`<img src="${img}">`:(i+1)}</div><div><div class="exnum">EXERCICE ${i+1}</div><div class="exname">${esc(e.name)}</div></div><button class="chev" data-sheet="${e.id}" data-no="${i+1}">›</button></div><div class="exbody"><div class="ref">Référence prévue : ${esc(ref)}</div><div class="status">${['Réussi','Échoué','Non réalisé'].map(x=>`<button data-status data-id="${e.id}" data-status="${x}" class="${sel===x?'sel':''}">${x}</button>`).join('')}</div></div></div>`}
function saveCurrentSession(duration,end){let c=state.today,s=c.session;let exs=s.startsWith('ATHLÉTIQUE')?[]:orderedSession(s);let rec={id:'h'+Date.now(),date:c.date,session:s,start:c.start,end,duration,exercises:exs.map(e=>({id:e.id,name:e.name,status:c.answers[e.id]||'Non réalisé',actual:state.refs[e.id]||'',next:c.next[e.id]||''}))};state.history.push(rec);if(c.kind==='G'){let g=+s[1];if(!state.completedG.includes(g))state.completedG.push(g);if(g<3)state.nextG=g+1}else state.lastComplement[s]=c.date;state.today=null;save();render()}
function renderAthToday(s){let c=state.today;let steps=DATA.ath[s];shell('Aujourd’hui',`${s} · 75 min`,`<div class="card cycle"><div><span class="tiny gold">${s}</span><strong style="display:block">60 min entraînement + 15 min mobilité</strong></div><div style="text-align:right"><span class="tiny muted">Début</span><b class="clock" style="display:block">${c.start}</b></div></div><div class="athcols">${steps.map((x,i)=>`<div class="athstep"><div class="gold tiny">${i+1}</div><h3>${x.name}</h3><div class="small muted">${x.duration}</div>${x.fields.map(f=>`<div class="field" style="margin-top:8px"><label>${f}</label><input data-ath="${i}|${f}"></div>`).join('')}</div>`).join('')}</div><div class="card"><div class="field"><label>Notes / ressenti / commentaire</label><textarea id="athNotes" rows="4"></textarea></div><div class="grid2" style="margin-top:9px"><div class="field"><label>Heure de fin</label><input id="endTime" value="${nowTime()}"></div><div class="field"><label>Durée totale</label><input id="dur" value="75" type="number"></div></div><button id="saveAth" class="btn primary block" style="margin-top:12px">Enregistrer la séance</button></div>`);$('#saveAth').onclick=()=>{c.ath={};$$('[data-ath]').forEach(x=>c.ath[x.dataset.ath]=x.value);c.notes=$('#athNotes').value;saveCurrentSession(+$('#dur').value,$('#endTime').value)}}
function renderProgram(){if(programDetail)return renderProgramDetail(programDetail);shell('Programme','Organisation de vos séances',`<div class="card"><div class="topline"><div><div class="eyebrow">CYCLE G</div><h2 style="margin:5px 0">Semaine ${state.cycle}</h2></div><div class="tools">${cycles.map(c=>`<button class="btn ${c===state.cycle?'primary':''}" data-cycle="${c}">${c}</button>`).join('')}</div></div></div><h2 class="sectionTitle">Séances principales</h2><div class="programGrid">${[1,2,3].map(n=>{let s=`G${n}${state.cycle}`;return `<button class="programBtn" data-prog="${s}"><b>G${n}</b><span>${groupLabel(s)}</span></button>`}).join('')}</div><h2 class="sectionTitle">Complémentaires</h2><div class="compGrid">${['ATHLÉTIQUE A','ATHLÉTIQUE B','FULL MIX 1','FULL MIX 2','FULL MIX 3','FULL MIX 4'].map(s=>`<button class="programBtn" data-prog="${s}"><b>${s.replace('LÉTIQUE ',' ')}</b><span>${groupLabel(s)}</span></button>`).join('')}</div><h2 class="sectionTitle">Outils</h2><div class="card"><div class="tools"><button class="btn" id="backup">Sauvegarder</button><label class="btn">Restaurer<input id="restore" type="file" hidden accept="application/json"></label><button class="btn" id="export">Exporter CSV</button><button class="btn" id="position">Position cycle</button></div></div>`);$$('[data-cycle]').forEach(b=>b.onclick=()=>{state.cycle=b.dataset.cycle;save();render()});$$('[data-prog]').forEach(b=>b.onclick=()=>{programDetail=b.dataset.prog;render()});$('#backup').onclick=backupJSON;$('#restore').onchange=restoreJSON;$('#export').onclick=exportCSV;$('#position').onclick=()=>{let c=prompt('Semaine A/B/C',state.cycle);let g=prompt('Prochaine G : 1, 2 ou 3',state.nextG);if(c&&cycles.includes(c.toUpperCase()))state.cycle=c.toUpperCase();if([1,2,3].includes(+g))state.nextG=+g;save();render()}}
function renderProgramDetail(s){if(s.startsWith('ATHLÉTIQUE'))return renderAthProgram(s);let exs=orderedSession(s);shell(s,groupLabel(s),`<button class="btn" id="backProg">← Programme</button><div class="card"><div class="topline"><div><div class="eyebrow">${s}</div><h2 style="margin:5px 0">${groupLabel(s)}</h2></div><button class="btn" id="editMode">Modifier</button></div><ul class="list" id="exerciseList">${exs.map((e,i)=>`<li class="dragrow" data-id="${e.id}"><div class="dragno">${i+1}</div><div class="thumb">${sheetFor(e.id)?`<img src="${sheetFor(e.id)}">`:''}</div><div><b>${esc(e.name)}</b><div class="tiny muted">${e.remark?esc(e.remark):'Fiche technique liée à l’exercice'}</div></div><div class="handle">☷</div></li>`).join('')}</ul><button class="btn block" id="addEx" style="margin-top:10px">+ Ajouter un exercice</button></div>`);$('#backProg').onclick=()=>{programDetail=null;render()};let edit=false;$('#editMode').onclick=()=>{edit=!edit;$('#editMode').textContent=edit?'Terminer':'Modifier';$('#exerciseList').classList.toggle('editing',edit)};$$('.dragrow').forEach(li=>{li.onclick=e=>{if(!edit && !e.target.classList.contains('handle'))openSheet(li.dataset.id,s,+li.querySelector('.dragno').textContent)}});enablePointerSort($('#exerciseList'),s);$('#addEx').onclick=()=>alert('L’ajout s’effectue depuis la bibliothèque d’exercices. La structure est prête ; les exercices existants gardent leur identité, paramètres et historique.')}
function enablePointerSort(list,s){let drag=null;$$('.handle',list).forEach(h=>{h.addEventListener('pointerdown',e=>{if(!$('#exerciseList').classList.contains('editing'))return;e.preventDefault();drag=h.closest('.dragrow');drag.classList.add('dragging');h.setPointerCapture(e.pointerId)});h.addEventListener('pointermove',e=>{if(!drag)return;let el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.dragrow');if(el&&el!==drag&&el.parentNode===list){let box=el.getBoundingClientRect();list.insertBefore(drag,e.clientY<box.top+box.height/2?el:el.nextSibling)}});h.addEventListener('pointerup',()=>{if(!drag)return;drag.classList.remove('dragging');let ids=$$('.dragrow',list).map(x=>x.dataset.id);state.sessionOrder[s]=ids;save();drag=null;renderProgramDetail(s)})})}
function renderAthProgram(s){shell(s,'75 min · fiche complète',`<button class="btn" id="backProg">← Programme</button><div class="card"><div class="eyebrow">DÉROULEMENT</div>${DATA.ath[s].map((x,i)=>`<div class="historyrow"><span class="gold">${i+1}</span> <b>${x.name}</b><span class="muted small" style="float:right">${x.duration}</span><div class="tiny muted" style="margin-top:4px">${x.fields.join(' · ')}</div></div>`).join('')}</div>`);$('#backProg').onclick=()=>{programDetail=null;render()}}
function allPerf(){let m={};state.history.forEach(h=>(h.exercises||[]).forEach(e=>{if(!m[e.id])m[e.id]=[];m[e.id].push({date:h.date,value:e.actual,status:e.status})}));return m}
function renderProgress(){let perf=allPerf();let ids=Object.keys(perf);shell('Progression','Évolution exercice par exercice',`<div class="tabs"><button class="on">Semaine</button><button>Mois</button><button>Années</button><button>Tous</button></div><div class="metrics"><div class="metric"><b>${state.history.length}</b><span class="small muted">séances détaillées</span></div><div class="metric"><b>${ids.length}</b><span class="small muted">exercices suivis</span></div></div><div class="card">${ids.length?ids.map(id=>{let name=findName(id);let a=perf[id];return `<div class="historyrow" data-prog="${id}"><div class="topline"><div><b>${esc(name)}</b><div class="tiny muted">Dernière séance : ${a.at(-1).date}</div></div><span class="badge">${a.length<2?'Données insuffisantes':'Suivi actif'}</span></div></div>`}).join(''):'<div class="muted">Les progressions apparaîtront après les premières performances enregistrées.</div>'}</div>`);$$('[data-prog]').forEach(x=>x.onclick=()=>openProgress(x.dataset.prog))}
function findName(id){for(const exs of Object.values(DATA.sessions))for(const e of exs)if(e.id===id)return e.name;return id}
function openProgress(id){let a=allPerf()[id]||[];shell(findName(id),'Détail de progression',`<button class="btn" id="backP">← Progression</button><div class="card"><div class="topline"><span class="badge">${a.length<2?'Données insuffisantes':'Progression suivie'}</span><span class="gold">${state.refs[id]||'—'}</span></div><div class="chart"><svg viewBox="0 0 300 130" preserveAspectRatio="none"><polyline fill="none" stroke="#d8ae50" stroke-width="3" points="${a.map((x,i)=>`${20+i*(260/Math.max(1,a.length-1))},${100-(i*12%70)}`).join(' ')}"/></svg></div></div><div class="card">${a.slice().reverse().map(x=>`<div class="historyrow"><b>${x.date}</b><span class="gold" style="float:right">${esc(x.value||'—')}</span><div class="tiny muted">${x.status}</div></div>`).join('')}</div><button class="btn block" id="psheet">Fiche technique et paramètres</button>`);$('#backP').onclick=()=>renderProgress();$('#psheet').onclick=()=>openSheet(id,'',1)}
function renderHistory(){if(historyDetail)return renderHistoryDetail(historyDetail);let yr=new Date().getFullYear();let hs=state.history.filter(h=>+h.date.slice(0,4)===yr),total=hs.reduce((a,h)=>a+(+h.duration||0),0);shell('Historique',`Vue annuelle · ${yr}`,`<div class="tabs"><button>Semaine</button><button>Mois</button><button class="on">Année</button><button>Tous</button></div><div class="metrics"><div class="metric"><b>${hs.length}</b><span class="small muted">séances</span></div><div class="metric"><b>${Math.floor(total/60)}h${String(total%60).padStart(2,'0')}</b><span class="small muted">durée totale</span></div><div class="metric"><b>${hs.length?Math.round(total/hs.length):0} min</b><span class="small muted">moyenne / séance</span></div><div class="metric"><b>8h20</b><span class="small muted">record hebdo de référence</span></div></div><div class="card"><div class="eyebrow">SÉANCES</div>${state.history.length?state.history.slice().reverse().map(h=>`<div class="historyrow" data-h="${h.id}"><b>${h.session}</b><span class="gold" style="float:right">${h.duration} min</span><div class="tiny muted">${h.date} · ${h.start||''}${h.end?' → '+h.end:''}</div></div>`).join(''):'<div class="muted" style="margin-top:10px">Aucune séance détaillée enregistrée.</div>'}</div><div class="card"><b>Historique antérieur</b><div class="small muted" style="margin-top:5px">Pour les années avant l’application, seuls les nombres de séances par semaine sont conservés (objectif historique /3). Depuis l’application, objectif /5.</div></div>`);$$('[data-h]').forEach(x=>x.onclick=()=>{historyDetail=x.dataset.h;render()})}
function renderHistoryDetail(id){let h=state.history.find(x=>x.id===id);if(!h){historyDetail=null;return renderHistory()};shell(h.session,`${h.date} · ${h.duration} min`,`<button class="btn" id="backH">← Historique</button><div class="card"><div class="topline"><div><div class="eyebrow">DÉTAIL SÉANCE</div><h2>${h.session}</h2></div><span class="badge">${h.start||''}${h.end?' → '+h.end:''}</span></div>${(h.exercises||[]).map((e,i)=>`<div class="historyrow"><span class="gold">${i+1}</span> <b>${esc(e.name)}</b><span style="float:right">${esc(e.status)}</span><div class="tiny muted">${esc(e.actual||'—')}</div></div>`).join('')}</div><button class="btn block" id="editH">Modifier la séance</button>`);$('#backH').onclick=()=>{historyDetail=null;render()};$('#editH').onclick=()=>alert('Correction manuelle prévue sans altérer la traçabilité des performances d’origine.')}
function defaultParams(id){let t=DATA.paramType[id]||'strength';let p=state.params[id]||{};if(Object.keys(p).length)return p;if(t==='gainage')return{type:t,tours:'5',normal:'1 min',gauche:'30 s',droite:'30 s',repos:'15–20 s'};if(t==='circuit')return{type:t,duree:'8 min',tours:'1'};return{type:t,series:'4',repetitions:'10',charge:state.refs[id]||'',reposSeries:'60–90 s',reposExercices:'2 min'}}
function paramInputs(p){return Object.entries(p).filter(([k])=>k!=='type').map(([k,v])=>`<div class="field"><label>${k.replace(/([A-Z])/g,' $1')}</label><input data-p="${k}" value="${esc(v)}"></div>`).join('')}
function occurrences(id){let out=[];for(const [s,exs] of Object.entries(DATA.sessions))exs.forEach((e,i)=>{if(e.id===id)out.push({s,n:i+1})});return out}
function openSheet(id,session,no){let name=findName(id),img=sheetFor(id,session,no),p=clone(defaultParams(id));let occ=occurrences(id);let ov=document.createElement('div');ov.className='overlay';ov.innerHTML=`<div class="sheet"><div class="sheetTop"><div><div class="eyebrow">FICHE TECHNIQUE</div><b>${esc(name)}</b></div><button class="btn" id="closeS">Fermer</button></div><div class="sheetMedia">${img?`<img src="${img}" alt="${esc(name)}">`:`<div class="missing"><div><div class="eyebrow">FICHE VALIDÉE À ASSOCIER</div><h2>${esc(name)}</h2><p>La structure de l’exercice est intégrée et son identité est unique. Aucune ancienne fiche aléatoire n’est affichée.</p></div></div>`}<div class="ctxbox"><div><label>SÉANCE</label><select id="ctxSession">${occ.map(o=>`<option value="${o.s}" ${o.s===session?'selected':''}>${o.s}</option>`).join('')}</select></div><div><label>EXERCICE</label><input id="ctxNo" type="number" value="${no||occ[0]?.n||1}"></div><button class="btn" id="ctxSave">Modifier</button></div></div><div class="sheetInfo"><div class="notice">L’exercice possède une seule identité technique, même lorsqu’il est réutilisé dans plusieurs séances. Le contexte séance/numéro est modifiable sans dupliquer l’historique.</div></div><div class="paramMask"><div class="paramPanel"><h3>Paramètres de l’exercice</h3><div class="paramGrid">${paramInputs(p)}</div><button class="btn primary block" id="saveP" style="margin-top:10px">Enregistrer les paramètres</button></div></div></div>`;document.body.appendChild(ov);$('#closeS',ov).onclick=()=>ov.remove();ov.onclick=e=>{if(e.target===ov)ov.remove()};$('#ctxSession',ov).onchange=()=>{let ss=$('#ctxSession',ov).value;let o=occ.find(x=>x.s===ss);if(o)$('#ctxNo',ov).value=o.n};$('#ctxSave',ov).onclick=()=>alert('Contexte affiché mis à jour. L’identité de l’exercice reste inchangée.');$('#saveP',ov).onclick=()=>{$$('[data-p]',ov).forEach(x=>p[x.dataset.p]=x.value);state.params[id]=p;if(p.charge){state.refs[id]=p.charge}save();ov.remove();render()}}
function backupJSON(){download('fitness-sauvegarde.json',JSON.stringify(state,null,2),'application/json')}
function exportCSV(){let rows=[['date','séance','début','fin','durée_min','exercice','valeur','statut','prochaine']];state.history.forEach(h=>(h.exercises||[]).forEach(e=>rows.push([h.date,h.session,h.start,h.end,h.duration,e.name,e.actual,e.status,e.next])));download('fitness-export.csv',rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\n'),'text/csv')}
function download(n,c,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restoreJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);state=Object.assign(defaultState(),x);state.installed=true;save();alert('Sauvegarde restaurée.');render()}catch{alert('Sauvegarde invalide.')}};r.readAsText(f)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;programDetail=null;historyDetail=null;render()}});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
