<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090a"><title>Fitness V0.2</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{--bg:#09090a;--card:#171718;--card2:#202022;--gold:#d2a84a;--text:#f5f2ea;--muted:#aaa49a;--line:#39342c;--ok:#4e805d;--fail:#8a4c4c}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#080809,#111113);color:var(--text);font-family:Arial,sans-serif}.app{max-width:520px;margin:auto;padding:22px 16px 105px}.brand{color:var(--gold);font-weight:900;letter-spacing:3px;font-size:13px}h1{font-size:29px;margin:5px 0 16px}h2{margin:4px 0 8px;font-size:20px}.muted{color:var(--muted);font-size:13px}.small{font-size:12px}.gold{color:var(--gold)}.card{background:linear-gradient(145deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:15px;margin:11px 0;box-shadow:0 10px 25px #0005}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.grow{flex:1}.badge{border:1px solid #5c4e2e;color:var(--gold);border-radius:999px;padding:5px 9px;font-size:12px}.btn{border:1px solid #514a3b;background:#1a1a1b;color:white;padding:10px;border-radius:11px}.goldbtn{background:var(--gold);border-color:var(--gold);color:#17130b;font-weight:800}.ok{border-color:#426a4e}.fail{border-color:#744646}.nr{border-color:#555}.selected.ok{background:#294934}.selected.fail{background:#552f2f}.selected.nr{background:#3b3b3b}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.exercise{padding:14px 0;border-bottom:1px solid #302d28}.exercise:last-child{border:0}.exname{font-weight:700;line-height:1.3;margin-bottom:9px}label{font-size:12px;color:var(--muted)}input,select{width:100%;background:#101011;border:1px solid #4a4336;color:white;border-radius:10px;padding:10px;margin:4px 0 9px;font-size:15px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.nav{position:fixed;bottom:0;left:0;right:0;background:#0c0c0df5;border-top:1px solid #302c25;display:flex;justify-content:center;padding-bottom:max(7px,env(safe-area-inset-bottom))}.navin{width:min(520px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:7px}.tab{border:0;background:none;color:#8e8981;padding:10px 1px;font-size:11px}.tab.active{color:var(--gold);font-weight:800}.sessionline{padding:11px 0;border-bottom:1px solid #302d28}.warning{color:#e2c987;font-size:12px}.stat{font-size:27px;color:var(--gold);font-weight:900}.top{display:flex;justify-content:space-between;align-items:flex-start}
</style></head><body><div id="app"></div>
<script>
const PROGRAM={B:{G3:["Développé militaire barre","Oiseau machine / Reverse Pec Deck","Élévations latérales assis avec haltères","Squat libre","Leg Press","Mollets assis machine","Relevé de jambes","Crunch abdominal"]}};
const COMPLEMENTS=["ATH A","ATH B","Full Mix 1","Full Mix 2","Full Mix 3","Full Mix 4"];
let old=JSON.parse(localStorage.getItem("fitness-v01")||"null");
let state=JSON.parse(localStorage.getItem("fitness-v02")||"null")||{setup:old?.setup||false,week:old?.week||"B",nextG:old?.nextG||"G3",history:old?.history||[],refs:old?.refs||{},draft:null};
let view="today";
const $=s=>document.querySelector(s); function save(){localStorage.setItem("fitness-v02",JSON.stringify(state))}
function nav(){return `<nav class="nav"><div class="navin">${[["today","Aujourd'hui"],["program","Programme"],["progress","Progression"],["history","Historique"]].map(x=>`<button class="tab ${view===x[0]?"active":""}" data-v="${x[0]}">${x[1]}</button>`).join("")}</div></nav>`}
function shell(title,body){$("#app").innerHTML=`<main class="app"><div class="top"><div><div class="brand">FITNESS</div><h1>${title}</h1></div><span class="badge">V0.2</span></div>${body}</main>${nav()}`;document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;render()})}
function setup(){shell("Première installation",`<p class="muted">Positionne ton cycle actuel.</p><div class="card"><label>Semaine</label><select id="w"><option>A</option><option>B</option><option>C</option></select><label>Prochaine séance G</label><select id="g"><option>G1</option><option>G2</option><option>G3</option></select><button class="btn goldbtn" id="go" style="width:100%">Commencer</button></div>`);$("#w").value=state.week;$("#g").value=state.nextG;$("#go").onclick=()=>{state.week=$("#w").value;state.nextG=$("#g").value;state.setup=true;save();render()}}
function list(){return PROGRAM[state.week]?.[state.nextG]||PROGRAM.B.G3}
function startDraft(){
 const now=new Date(); const hh=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
 state.draft={name:state.nextG+state.week,date:now.toISOString().slice(0,10),start:hh,end:"",duration:"",exercises:{}};
 list().forEach(x=>state.draft.exercises[x]={actual:state.refs[x]||"",status:"",next:""});
 save();render()
}
function calcDuration(){
 let d=state.draft;if(!d.start||!d.end)return;
 let [sh,sm]=d.start.split(":").map(Number),[eh,em]=d.end.split(":").map(Number);let m=(eh*60+em)-(sh*60+sm);if(m<0)m+=1440;d.duration=String(m);save()
}
function today(){
 if(!state.setup)return setup();
 let d=state.draft,L=list();
 let body=`<p class="muted">${new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</p>
 <div class="card"><div class="row between"><div><div class="gold small">SÉANCE</div><h2>${state.nextG}${state.week}</h2></div>${!d?`<button class="btn goldbtn" id="start">Saisir la séance</button>`:`<span class="badge">En saisie</span>`}</div></div>`;
 if(d){body+=`<div class="card"><div class="two"><div><label>Date</label><input id="date" type="date" value="${d.date}"></div><div><label>Durée (min)</label><input id="duration" type="number" min="0" value="${d.duration}" placeholder="ex. 75"></div><div><label>Heure de début</label><input id="stime" type="time" value="${d.start}"></div><div><label>Heure de fin</label><input id="etime" type="time" value="${d.end}"></div></div><div class="warning">La durée se calcule avec début/fin, mais tu peux la corriger manuellement.</div></div>
 <div class="card">${L.map((x,i)=>{let e=d.exercises[x]||{actual:"",status:"",next:""};return `<div class="exercise" data-ex="${i}"><div class="exname">${i+1}. ${x}</div><label>Charge / référence réellement utilisée</label><input class="actual" data-i="${i}" value="${e.actual||""}" placeholder="ex. 30 kg, 10 kg, 45 s…"><div class="grid3">${["Réussi","Échoué","Non réalisé"].map((s,j)=>`<button class="btn ${j==0?"ok":j==1?"fail":"nr"} status ${e.status===s?"selected":""}" data-i="${i}" data-s="${s}">${s}</button>`).join("")}</div>${e.status==="Réussi"?`<div style="margin-top:9px"><label>Prochaine référence</label><input class="nextref" data-i="${i}" value="${e.next||""}" placeholder="Référence pour la prochaine fois"></div>`:""}</div>`}).join("")}</div>
 <div class="card"><button class="btn goldbtn" id="saveSession" style="width:100%">Enregistrer la séance</button><button class="btn" id="cancel" style="width:100%;margin-top:8px">Annuler la saisie</button></div>`}
 shell("Aujourd'hui",body);
 if(!d){$("#start").onclick=startDraft;return}
 $("#date").onchange=e=>{d.date=e.target.value;save()};$("#duration").oninput=e=>{d.duration=e.target.value;save()};$("#stime").onchange=e=>{d.start=e.target.value;calcDuration();render()};$("#etime").onchange=e=>{d.end=e.target.value;calcDuration();render()};
 document.querySelectorAll(".actual").forEach(inp=>inp.oninput=e=>{let x=L[+e.target.dataset.i];d.exercises[x].actual=e.target.value;save()});
 document.querySelectorAll(".status").forEach(b=>b.onclick=()=>{let x=L[+b.dataset.i];d.exercises[x].status=b.dataset.s;if(b.dataset.s!=="Réussi")d.exercises[x].next="";save();render()});
 document.querySelectorAll(".nextref").forEach(inp=>inp.oninput=e=>{let x=L[+e.target.dataset.i];d.exercises[x].next=e.target.value;save()});
 $("#cancel").onclick=()=>{if(confirm("Annuler cette saisie ?")){state.draft=null;save();render()}};
 $("#saveSession").onclick=()=>{if(!d.duration){alert("Renseigne la durée de la séance.");return} let items=L.map(x=>({name:x,...d.exercises[x]}));items.forEach(e=>{if(e.status==="Réussi"&&e.next.trim())state.refs[e.name]=e.next.trim();else if(e.actual.trim()&&!state.refs[e.name])state.refs[e.name]=e.actual.trim()});state.history.unshift({date:d.date,name:d.name,start:d.start,end:d.end,duration:+d.duration,exercises:items});state.draft=null;if(state.nextG==="G1")state.nextG="G2";else if(state.nextG==="G2")state.nextG="G3";else state.nextG="DONE";save();render()}
}
function program(){shell("Programme",`<div class="card"><h2>Cycle actuel</h2><div class="stat">Semaine ${state.week}</div><p class="muted">Prochaine étape : ${state.nextG}</p></div><div class="card"><h2>Complémentaires</h2><p class="muted">${COMPLEMENTS.join(" · ")}</p></div>`)}
function progress(){let refs=Object.entries(state.refs);shell("Progression",`<div class="card"><div class="stat">${state.history.length}</div><div class="muted">séances enregistrées</div></div><div class="card"><h2>Références actuelles</h2>${refs.length?refs.map(([k,v])=>`<div class="sessionline"><b>${k}</b><div class="gold">${v}</div></div>`).join(""):`<p class="muted">Aucune référence enregistrée.</p>`}</div>`)}
function history(){shell("Historique",`<div class="card"><h2>Séances</h2>${state.history.length?state.history.map(h=>`<div class="sessionline"><b>${h.name}</b><div class="muted">${new Date(h.date+"T12:00:00").toLocaleDateString("fr-FR")} · ${h.duration} min${h.start?" · "+h.start+(h.end?" → "+h.end:""):""}</div></div>`).join(""):`<p class="muted">Aucune séance enregistrée.</p>`}</div>`)}
function render(){if(view==="today")today();else if(view==="program")program();else if(view==="progress")progress();else history()} render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
